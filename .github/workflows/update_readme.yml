name: Update README

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  update-readme:
    name: Update Recent Activity
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Recent Activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          username = "jctibaquiram"
          max_lines = 5

          url = f"https://api.github.com/users/{username}/events/public?per_page=100"

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              events = json.load(response)

          activities = []

          for event in events:
              if event.get("type") != "PushEvent":
                  continue

              repo = event["repo"]["name"]
              payload = event.get("payload", {})

              commits = payload.get("commits", [])

              commit_count = len(commits)

              if commit_count == 0:
                  continue

              if commit_count == 1:
                  text = f"⬆️ Pushed 1 commit to [{repo}](https://github.com/{repo})"
              else:
                  text = f"⬆️ Pushed {commit_count} commits to [{repo}](https://github.com/{repo})"

              activities.append(text)

              if len(activities) >= max_lines:
                  break

          start = "<!--RECENT_ACTIVITY:start-->"
          end = "<!--RECENT_ACTIVITY:end-->"

          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          if start not in readme or end not in readme:
              raise SystemExit("Recent Activity markers not found in README.md")

          new_activity = "\n".join(
              f"{i}. {activity}"
              for i, activity in enumerate(activities, start=1)
          )

          replacement = f"{start}\n{new_activity}\n{end}"

          start_index = readme.index(start)
          end_index = readme.index(end) + len(end)

          updated_readme = (
              readme[:start_index]
              + replacement
              + readme[end_index:]
          )

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(updated_readme)

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True,
          )

          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )

          subprocess.run(["git", "add", "README.md"], check=True)

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"],
              capture_output=True,
          )

          if result.returncode != 0:
              subprocess.run(
                  ["git", "commit", "-m", "Update recent activity"],
                  check=True,
              )

              subprocess.run(
                  ["git", "push"],
                  check=True,
              )
          else:
              print("No changes to README.md")
          PY
